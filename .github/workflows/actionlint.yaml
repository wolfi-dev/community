name: Action Lint

on:
  pull_request:
    branches: [ 'main', 'release-*' ]

permissions: {}

jobs:

  action-lint:
    name: Action lint
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout + action-actionlint read the tree

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find yamls
        id: get_yamls
        run: |
          yamls="$(find .github/workflows -name "*.y*ml" | grep -v dependabot. | xargs echo)"
          echo "files=${yamls}" >> "$GITHUB_OUTPUT"

      - name: Action lint
        uses: step-security/action-actionlint@b2b21b6e020989da8beae86d6c3a1291c46d45d5 # v1.76.0
        with:
          actionlint_flags: ${{ steps.get_yamls.outputs.files }}
