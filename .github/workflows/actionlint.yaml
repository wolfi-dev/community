name: Action Lint

on:
  pull_request:
    branches: [ 'main', 'release-*' ]

permissions: {}

jobs:

  action-lint:
    name: Action lint
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout + action-actionlint read the tree

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2
        with:
          persist-credentials: false

      - name: Find yamls
        id: get_yamls
        run: |
          yamls="$(find .github/workflows -name "*.y*ml" | grep -v dependabot. | xargs echo)"
          echo "files=${yamls}" >> "$GITHUB_OUTPUT"

      - name: Action lint
        uses: step-security/action-actionlint@b2b21b6e020989da8beae86d6c3a1291c46d45d5 # v1.76.0
        with:
          actionlint_flags: ${{ steps.get_yamls.outputs.files }}
